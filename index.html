<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENDYMION Emulator Terminal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:Consolas,monospace;height:100vh;overflow:hidden}
.window{position:fixed;inset:0 0 0 0;background:#000;display:flex;flex-direction:column}
.titlebar{background:#1a1a1a;color:#fff;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;flex-shrink:0}
.win-btns{display:flex;gap:2px}
.win-btns button{width:44px;height:44px;background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
.win-btns button:active{background:#333}
.close:active{background:#e81123!important}
.terminal{flex:1;background:#000;color:#fff;padding:14px;overflow-y:auto;font-size:16px;line-height:1.6}
.line{white-space:pre-wrap;word-break:break-word}
.prompt{color:#00ff88}
#out{margin-bottom:10px}
.input-line{display:flex;align-items:center;background:#111;border:1px solid #00ff88;border-radius:6px;padding:10px;margin-top:10px}
.input-line input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:inherit;font-size:18px;min-width:0}
.kb-btn{background:#00ff88;color:#000;border:none;padding:12px 14px;border-radius:8px;font-weight:bold;font-size:16px;margin:10px;cursor:pointer;width:calc(100% - 20px)}
.taskbar{height:48px;background:#1a1a1a;display:flex;align-items:center;padding:0 10px;gap:10px;color:#fff;font-size:13px;flex-shrink:0}
</style>
</head>
<body>
<div class="window" id="win">
<div class="titlebar"><div>&gt; ENDYMION Emulator Terminal</div><div class="win-btns"><button onclick="minWin()">_</button><button onclick="maxWin()">□</button><button class="close" onclick="closeWin()">X</button></div></div>
<div class="terminal" id="term" onclick="focusIn()">
<div class="line">ENDYMION Emulator Terminal [Version 1.0]</div>
<div class="line">(c) ENDYMION. All rights reserved.</div>
<div class="line">Tap below to type. Try: help</div><br>
<div id="out"></div>
<div class="input-line"><span class="prompt">C:\Users\Endymion&gt;&nbsp;</span><input id="inp" type="text" enterkeyhint="go" autocomplete="off" autocapitalize="off"></div>
<button class="kb-btn" onclick="focusIn()">⌨️ اضغط هنا باش تكتب</button>
</div>
<div class="taskbar"><div>⊞ Start</div><div>ENDYMION</div><div style="margin-left:auto" id="time"></div></div>
</div>
<script>
let out=document.getElementById('out'),inp=document.getElementById('inp'),term=document.getElementById('term');
function focusIn(){inp.focus();inp.click();}
function print(t){let d=document.createElement('div');d.className='line';d.textContent=t;out.appendChild(d);term.scrollTop=term.scrollHeight;}
function cmd(c){
let a=c.trim().toLowerCase();
if(!a)return;
print('C:\\Users\\Endymion> '+c);
if(a==='help')print('help, dir, ls, echo, cls, ver, ipconfig, whoami, endy scan, banner, exit');
else if(a==='dir'||a==='ls')print('endy.exe  ENDYMION Emulator Terminal');
else if(a==='ver')print('ENDYMION Emulator Terminal [Version 1.0]');
else if(a==='whoami')print('endymion');
else if(a==='ipconfig')print('IPv4: 192.168.1.10');
else if(a==='banner')print('ENDYMION Emulator Terminal');
else if(a.startsWith('echo '))print(c.slice(5));
else if(a==='cls'||a==='clear')out.innerHTML='';
else if(a.startsWith('endy scan'))print('[*] Scanning '+(c.split(' ')[2]||'target')+' ... [OK]');
else if(a==='exit')print('Click X to close.');
else print("'"+c+"' not recognized.');
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){cmd(inp.value);inp.value='';setTimeout(()=>inp.focus(),50);}});
function minWin(){document.getElementById('win').style.display='none';setTimeout(()=>{document.getElementById('win').style.display='flex';},800);}
function maxWin(){alert('Fullscreen OK');}
function closeWin(){if(confirm('Close ENDYMION?')){document.getElementById('win').innerHTML='<div style="color:#fff;padding:40px;text-align:center">ENDYMION closed<br><br><button onclick="location.reload()" style="padding:12px 20px">Reopen</button></div>';}}
setInterval(()=>{document.getElementById('time').textContent=new Date().toLocaleTimeString();},1000);
window.onload=()=>{setTimeout(()=>inp.focus(),500);};
</script>
</body>
</html>
