<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ENDYMION Emulator Terminal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;font-family:monospace;height:100dvh;overflow:hidden;touch-action:manipulation}
.top{background:#1a1a1a;color:#fff;height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:15px}
.top button{width:48px;height:48px;background:none;border:none;color:#fff;font-size:22px}
.top button:active{background:#333}
.term{height:calc(100dvh - 50px - 150px);background:#000;color:#fff;padding:14px;overflow-y:auto;font-size:17px;line-height:1.6}
.line{white-space:pre-wrap;word-break:break-word}
.out{margin-bottom:8px}
.bottom{background:#111;padding:10px;border-top:1px solid #222}
.cmd-row{display:flex;gap:8px}
.cmd-row input{flex:1;background:#1a1a1a;border:2px solid #00ff88;border-radius:12px;color:#fff;font-size:20px;padding:16px 12px;outline:none;min-width:0}
.go-btn{background:#00ff88;color:#000;border:none;border-radius:12px;padding:0 22px;font-size:20px;font-weight:bold;min-width:70px}
.go-btn:active{background:#00cc6a}
.kb-btn{background:#222;color:#fff;border:1px solid #333;border-radius:12px;padding:12px;margin-top:10px;width:100%;font-size:16px}
.quick{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.quick button{background:#222;color:#00ff88;border:1px solid #333;border-radius:20px;padding:10px 14px;font-size:14px;white-space:nowrap;flex-shrink:0}
.quick button:active{background:#00ff88;color:#000}
</style>
</head>
<body>
<div class="top"><div>&gt; ENDYMION Emulator Terminal</div><div><button onclick="minWin()">_</button><button onclick="closeWin()">X</button></div></div>
<div class="term" id="term" onclick="focusIn()">
<div class="line">ENDYMION Emulator Terminal [Phone Edition]</div>
<div class="line">اكتب help و اضغط GO</div><br>
<div id="out"></div>
</div>
<div class="bottom">
<div class="cmd-row">
<input id="inp" type="text" placeholder="اكتب هنا... help" autocomplete="off" autocapitalize="off" enterkeyhint="go">
<button class="go-btn" onclick="runCmd()">GO ▶</button>
</div>
<button class="kb-btn" onclick="focusIn()">⌨️ اضغط هنا باش يبان الكلافي</button>
<div class="quick">
<button onclick="quick('help')">help</button>
<button onclick="quick('dir')">dir</button>
<button onclick="quick('ver')">ver</button>
<button onclick="quick('ipconfig')">ipconfig</button>
<button onclick="quick('banner')">banner</button>
<button onclick="quick('endy scan google.com')">endy scan</button>
<button onclick="quick('cls')">cls</button>
</div>
</div>
